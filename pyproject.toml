[project]
name = "pisocheck"
version = "0.1.1"
description = "Análisis automatizado de viviendas con datos públicos"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "reportlab>=4.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "click>=8.1",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff",
    "mypy",
]

[project.scripts]
pisocheck = "pisocheck.main:main"

# Vercel exige un único punto de entrada Python por proyecto cuando detecta
# pyproject.toml en la raíz — ver api/index.py (que reúne ahí el análisis
# real y el diagnóstico, antes en dos archivos separados).
[tool.vercel]
entrypoint = "api.index:handler"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pisocheck*"]

[tool.setuptools.package-data]
pisocheck = ["reports/templates/*.j2"]
